name: Native template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: ./scripts/install_linux_dependencies.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: ./scripts/check.sh
      - if: runner.os == 'macOS'
        run: ./scripts/build.sh
      - if: runner.os == 'Linux'
        run: ./scripts/build.sh --deb-only
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: dist/
